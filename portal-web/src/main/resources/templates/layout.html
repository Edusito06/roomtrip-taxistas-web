<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'RoomTrip Taxi - ' + ${titulo}">RoomTrip Taxi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23d1f7f7'/%3E%3Cpath fill='%2318c0c1' d='M6.5 15.5h11l-1.2-4.8a2 2 0 0 0-1.94-1.5H9.64a2 2 0 0 0-1.94 1.5l-1.2 4.8Z'/%3E%3Ccircle cx='8.5' cy='16.5' r='1.4' fill='%23d1f7f7' stroke='%2318c0c1' stroke-width='.6'/%3E%3Ccircle cx='15.5' cy='16.5' r='1.4' fill='%23d1f7f7' stroke='%2318c0c1' stroke-width='.6'/%3E%3Cpath fill='%2318c0c1' d='M9 9.2h6v1.4H9z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav th:fragment="navbar(activo)" class="navbar navbar-expand-lg navbar-light app-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand app-brand" th:href="@{/}">
      <span class="app-brand-mark"><i class="bi bi-car-front-fill"></i></span>
      RoomTrip <span class="text-brand-accent">Taxi</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPrincipal"
            aria-controls="navPrincipal" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navPrincipal">
      <div class="navbar-nav me-auto">
        <a class="nav-link" th:href="@{/admin/solicitudes}"
           th:classappend="${activo == 'solicitudes'} ? 'active' : ''">
          <i class="bi bi-inbox me-1"></i>Solicitudes
        </a>
        <a class="nav-link" th:href="@{/admin/taxistas}"
           th:classappend="${activo == 'taxistas'} ? 'active' : ''">
          <i class="bi bi-people me-1"></i>Padrón de taxistas
        </a>
        <a class="nav-link" th:href="@{/admin/eventos}"
           th:classappend="${activo == 'eventos'} ? 'active' : ''">
          <i class="bi bi-clock-history me-1"></i>Eventos
        </a>
      </div>
      <form th:action="@{/logout}" method="post" class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
        <span class="app-user-chip">
          <i class="bi bi-person-circle"></i>
          <span th:text="${correo}"></span>
        </span>
        <button class="btn btn-sm btn-logout" type="submit">
          <i class="bi bi-box-arrow-right me-1"></i>Salir
        </button>
      </form>
    </div>
  </div>
</nav>

<nav th:fragment="navbarTaxista" class="navbar navbar-expand-lg navbar-light app-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand app-brand" th:href="@{/}">
      <span class="app-brand-mark"><i class="bi bi-car-front-fill"></i></span>
      RoomTrip <span class="text-brand-accent">Taxi</span>
    </a>
    <div class="navbar-nav me-auto d-none d-lg-flex">
      <a class="nav-link active" th:href="@{/mi-cuenta}"><i class="bi bi-speedometer2 me-1"></i>Mi cuenta</a>
    </div>
    <form th:action="@{/logout}" method="post" class="d-flex align-items-center gap-3">
      <span class="app-user-chip d-none d-sm-inline-flex">
        <i class="bi bi-person-circle"></i>
        <span th:text="${correo}"></span>
      </span>
      <button class="btn btn-sm btn-logout" type="submit">
        <i class="bi bi-box-arrow-right me-1"></i>Salir
      </button>
    </form>
  </div>
</nav>

<div th:fragment="alertas" class="container">
  <div th:if="${error}" class="app-alert app-alert-danger" role="alert">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span th:text="${error}"></span>
  </div>
  <div th:if="${exito}" class="app-alert app-alert-success" role="alert">
    <i class="bi bi-check-circle-fill"></i>
    <span th:text="${exito}"></span>
  </div>
</div>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
