server:
  port: ${PORT:8083}

spring:
  application:
    name: portal-web
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
  web:
    resources:
      chain:
        # app.css y app.js salen como /css/app-<hash>.css: cada despliegue cambia la URL y el
        # navegador nunca se queda con una hoja de estilos vieja.
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  gateway-url: ${GATEWAY_URL:http://localhost:8080}
  cloudinary-url: ${CLOUDINARY_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
