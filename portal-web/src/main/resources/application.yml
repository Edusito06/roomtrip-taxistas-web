server:
  port: ${PORT:8083}
  # Detras del proxy de Cloud Run el HTTPS termina antes de llegar aqui: sin esto, las redirecciones
  # salian como http:// en lugar de https://. Respeta X-Forwarded-Proto/Host.
  forward-headers-strategy: framework
  servlet:
    session:
      # Solo cookie: sin ';jsessionid=...' pegado a la URL.
      tracking-modes: cookie
      # Inactividad maxima: pasado este tiempo sin pedidos, la sesion expira y se pide login de nuevo.
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        # true en la nube (HTTPS); en local el portal corre en http y la cookie Secure no se enviaria.
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: portal-web
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
  web:
    resources:
      chain:
        # app.css y app.js salen como /css/app-<hash>.css: cada despliegue cambia la URL y el
        # navegador nunca se queda con una hoja de estilos vieja.
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  gateway-url: ${GATEWAY_URL:http://localhost:8080}
  cloudinary-url: ${CLOUDINARY_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
