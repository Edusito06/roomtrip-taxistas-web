server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway-service

app:
  jwt:
    secret: ${JWT_SECRET:cambiame-por-un-secreto-largo-de-al-menos-32-caracteres}
  servicios:
    taxista-url: ${TAXISTA_SERVICE_URL:http://localhost:8081}
    calificacion-url: ${CALIFICACION_SERVICE_URL:http://localhost:8082}

# Unidad 5 del curso: "Gateway y resiliencia".
# Si mas del 50% de las ultimas llamadas falla, el circuito se abre 10s y el
# gateway responde el fallback sin volver a golpear el servicio caido.
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      taxistaCB:
        baseConfig: default
      calificacionCB:
        baseConfig: default
  timelimiter:
    configs:
      default:
        # 4 s en local (falla rapido si un servicio se cuelga). En Cloud Run el script lo sube a 20 s:
        # un servicio que escalo a cero tarda 10 a 14 s en arrancar y con 4 s la primera peticion
        # tras un rato de inactividad devolvia 503 aunque el servicio estuviera sano.
        timeoutDuration: ${GATEWAY_TIMEOUT:4s}
    instances:
      taxistaCB:
        baseConfig: default
      calificacionCB:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
