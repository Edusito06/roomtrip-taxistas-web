name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Incluye GatewayIntegrationTest, que levanta Mongo con Testcontainers (Docker ya viene en el runner).
      - name: Compilar y probar
        run: mvn -B clean verify
