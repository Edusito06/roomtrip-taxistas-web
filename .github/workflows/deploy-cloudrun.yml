name: Deploy a Cloud Run

# Se dispara en cada merge a main. Requiere en Settings > Secrets and variables > Actions:
#   GCP_PROJECT_ID  id del proyecto de Google Cloud
#   GCP_SA_KEY      JSON de la cuenta de servicio (roles: Cloud Run Admin, Artifact Registry Writer,
#                   Service Account User y Secret Manager Secret Accessor)
# Los secretos de la aplicacion (JWT, Mongo, Cloudinary, claves iniciales) viven en Secret Manager,
# nunca en GitHub. Ver docs/DESPLIEGUE.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify

  # Los secrets no se pueden evaluar en un `if` de job, asi que se comprueba aqui. Mientras
  # no esten GCP_PROJECT_ID y GCP_SA_KEY el despliegue se omite en lugar de fallar.
  credenciales:
    runs-on: ubuntu-latest
    outputs:
      listas: ${{ steps.revisar.outputs.listas }}
    steps:
      - id: revisar
        env:
          PROYECTO: ${{ secrets.GCP_PROJECT_ID }}
          CLAVE: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$PROYECTO" ] && [ -n "$CLAVE" ]; then
            echo "listas=true" >> "$GITHUB_OUTPUT"
          else
            echo "listas=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Despliegue omitido: faltan los secrets GCP_PROJECT_ID y GCP_SA_KEY (ver docs/DESPLIEGUE.md)."
          fi

  desplegar:
    needs: [verificar, credenciales]
    if: needs.credenciales.outputs.listas == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Autenticar Docker contra Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Desplegar
        run: ./scripts/deploy-cloudrun.sh "${GITHUB_SHA::7}"
